[project]
name = "surrogate-lab"
version = "0.1.0"
description = "A toolkit for training, comparing, and validating surrogate models for expensive simulations or experiments, with an emphasis on reliability over raw accuracy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "NicholasTJL" }]
keywords = ["surrogate-model", "machine-learning", "scikit-learn", "uncertainty", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "typer>=0.12",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/NicholasTJL/surrogate-lab"
Issues = "https://github.com/NicholasTJL/surrogate-lab/issues"

[project.scripts]
surrogate-lab = "surrogate_lab.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surrogate_lab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No explicit python_version pin: numpy's bundled type stubs use syntax that
# requires mypy to target the interpreter it's actually running under, and CI
# runs mypy separately under each supported Python version (see ci.yml).
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "matplotlib.*", "matplotlib.pyplot"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/surrogate_lab"]
